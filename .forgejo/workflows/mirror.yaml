name: Mirror repository on merge

on:
  push:
    branches:
      - main

jobs:
  mirror-repository:
    if: ${{ github.repository }} != EpitechPGE2-2025/G-YEP-400-LIL-4-1-zappy-2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Mirror to repo
        if: ${{ success() }}
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:EpitechPGE2-2025/G-YEP-400-LIL-4-1-zappy-2.git
          ssh_private_key: ${{ secrets.MIRROR_SSH_KEY }}
